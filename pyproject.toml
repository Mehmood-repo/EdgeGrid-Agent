[project]
name = "edgegrid-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scipy>=1.17.1",
    "torch==2.5.1",
    "torch-geometric>=2.8.0.post1",
    "torch-geometric-temporal>=0.56.2",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "torch-cluster==1.6.3",
    "pandas>=3.0.5",
    "numpy>=2.5.2",
    "networkx>=3.6.1",
    "matplotlib>=3.11.1",
    "scikit-learn>=1.9.0",
    "pyarrow>=25.0.1",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch-scatter = { url = "https://data.pyg.org/whl/torch-2.5.0%2Bcpu/torch_scatter-2.1.2%2Bpt25cpu-cp312-cp312-linux_x86_64.whl" }
torch-sparse = { url = "https://data.pyg.org/whl/torch-2.5.0%2Bcpu/torch_sparse-0.6.18%2Bpt25cpu-cp312-cp312-linux_x86_64.whl" }
torch-cluster = { url = "https://data.pyg.org/whl/torch-2.5.0%2Bcpu/torch_cluster-1.6.3%2Bpt25cpu-cp312-cp312-linux_x86_64.whl" }

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
